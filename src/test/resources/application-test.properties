# Test Configuration - COMPLETELY override Oracle settings
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable JDBC repositories
spring.data.jdbc.repositories.enabled=false

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# H2 Console
spring.h2.console.enabled=true

# HikariCP configuration for tests

spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=45000
spring.datasource.hikari.leak-detection-threshold=3000
spring.datasource.hikari.auto-commit=true

# Test-specific settings
spring.datasource.hikari.pool-name=TestHikariPool
