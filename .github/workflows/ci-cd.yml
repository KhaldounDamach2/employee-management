name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean package

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: employee-management-app
        path: target/*.jar

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t employee-management:latest .
        docker images

    - name: Test Docker image
      run: |
        # Test that the image builds and starts (without database connection)
        docker run -d --name test-app -p 8080:8080 -e SPRING_DATASOURCE_URL=jdbc:h2:mem:testdb employee-management:latest
        sleep 15
        docker ps
        docker logs test-app | head -20
        docker stop test-app

  # UPDATED DEPLOYMENT JOB USING deploy.sh:
  deploy:
    runs-on: ubuntu-latest
    needs: [build, docker-build]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to Production Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          echo "🚀 Starting automated deployment..."
          cd $HOME/employee-management-deploy
          
          # Download latest deploy.sh from repo
          curl -sL -O https://raw.githubusercontent.com/KhaldounDamach2/employee-management/main/deploy.sh
          chmod +x deploy.sh
          
          # Pull latest code and run professional deployment
          git pull origin main
          ./deploy.sh
          
          echo "✅ Professional deployment completed!"
          echo "🌐 Your app is now live at: http://${{ secrets.SERVER_HOST }}:8081"