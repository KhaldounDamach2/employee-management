name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      oracle:
        image: container-registry.oracle.com/database/express:21.3.0-xe
        env:
          ORACLE_PWD: Knn1973,00
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 1521:1521

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build and test with Maven
      run: mvn clean package
      env:
        SPRING_DATASOURCE_URL: jdbc:oracle:thin:@localhost:1521:XE
        SPRING_DATASOURCE_USERNAME: system
        SPRING_DATASOURCE_PASSWORD: Knn1973,00

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: employee-management-app
        path: target/*.jar

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t employee-management:latest .
        docker images

    - name: Test Docker image
      run: |
        docker run -d --name test-app -p 8080:8080 employee-management:latest
        sleep 30
        docker ps
        docker logs test-app