name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean package

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: employee-management-app
        path: target/*.jar

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t employee-management:latest .
        docker images

    - name: Test Docker image
      run: |
        # Test that the image builds and starts (without database connection)
        docker run -d --name test-app -p 8080:8080 -e SPRING_DATASOURCE_URL=jdbc:h2:mem:testdb employee-management:latest
        sleep 15
        docker ps
        docker logs test-app | head -20
        docker stop test-app