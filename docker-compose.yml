version: '3.8'
services:
  oracle-db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: employee-oracle-db
    environment:
      - ORACLE_PWD=${ORACLE_PASSWORD}
    ports:
      - "${DB_PORT}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "bash", "-c", "echo \"SELECT 'READY' FROM dual;\" | sqlplus -s system/$$ORACLE_PWD@XE"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  db-init:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: employee-db-init
    environment:
      - ORACLE_PWD=${ORACLE_PASSWORD}
    volumes:
      - ./sql-scripts:/scripts
    depends_on:
      oracle-db:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for Oracle to be fully ready...'
        sleep 30
        
        echo 'Running database initialization scripts...'
        for sql_file in /scripts/tables/*.sql; do
          echo \"Running table script: $$sql_file\"
          sqlplus -s system/\"$$ORACLE_PWD\"@employee-oracle-db:1521/XE @\"$$sql_file\"
        done

        for sql_file in /scripts/packages/*.sql; do
          echo \"Running package script: $$sql_file\"
          sqlplus -s system/\"$$ORACLE_PWD\"@employee-oracle-db:1521/XE @\"$$sql_file\"
        done
        
        echo 'Database initialization complete!'
      "

  app:
    build: .
    container_name: employee-management-app
    ports:
      - "${APP_PORT}:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${ORACLE_PASSWORD}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s   

volumes:
  oracle-data: