<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-warning">
                <h2>Edit Employee</h2>
            </div>
            <div class="card-body">
                <form th:action="@{/employees/update/{id}(id=${employee.id})}" method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">Employee Name</label>
                        <input type="text" class="form-control" id="name" name="name" 
                               th:value="${employee.name}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Employee ID</label>
                        <input type="text" class="form-control" th:value="${employee.id}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Created Date</label>
                        <input type="text" class="form-control" th:value="${employee.createdDate}" readonly>
                    </div>
                    <button type="submit" class="btn btn-warning">Update Employee</button>
                    <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
